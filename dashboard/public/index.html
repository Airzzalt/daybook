<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Dashboard</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --card:#161617; --card2:#1d1d1f; --sunk:#0f0f10;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#eeeef1; --tx2:#a0a2ab; --tx3:#6c6e78;
  --blue:#4f9bf0; --green:#3ecf8e; --red:#ff6b5b; --amber:#f0b95a; --violet:#b4b4bd;
  --r:16px;
  --out:cubic-bezier(.23,1,.32,1);          /* things entering / responding to touch */
  --move:cubic-bezier(.645,.045,.355,1);    /* things already on screen that move */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--tx); min-height:100dvh; overflow-x:hidden;
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}

/* ---------- light behind the glass (so there is something to bend) ---------- */
.bg{display:none}
.bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;will-change:transform}
.bg i:nth-child(1){left:-22vmax;top:-30vmax;background:radial-gradient(circle,rgba(47,169,232,.26),transparent 62%);animation:d1 32s ease-in-out infinite alternate}
.bg i:nth-child(2){right:-30vmax;top:10vmax;background:radial-gradient(circle,rgba(130,92,230,.22),transparent 62%);animation:d2 38s ease-in-out infinite alternate}
.bg i:nth-child(3){left:10vmax;bottom:-44vmax;background:radial-gradient(circle,rgba(62,207,142,.14),transparent 62%);animation:d1 44s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate3d(9vmax,6vmax,0)}}
@keyframes d2{to{transform:translate3d(-8vmax,9vmax,0)}}

/* ---------- liquid glass (floating controls only, never the content) ---------- */
.glass{
  position:relative;
  background:rgba(30,30,32,.9);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);
}
.glass::before,.glass::after{content:none}
@media (hover:hover) and (pointer:fine){.glass:hover::after{opacity:1}}

/* ---------- floating top bar ---------- */
.top{
  position:sticky; top:max(10px,env(safe-area-inset-top)); z-index:50;
  width:calc(100% - 24px); max-width:1280px; margin:10px auto 0;
  border-radius:24px; padding:8px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 0 4px;position:relative;z-index:1}
.logo{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,#fff,#b9bcc6);color:#0a0b0d}
.brand b{font-size:14px;letter-spacing:-.01em}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(245,197,99,.16);color:var(--amber)}
.seg{
  position:relative;z-index:1;display:flex;padding:3px;border-radius:15px;max-width:100%;
  background:rgba(0,0,0,.3);box-shadow:inset 0 1px 3px rgba(0,0,0,.55);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;padding:6px 11px;border-radius:12px;color:var(--tx2);font-weight:500;white-space:nowrap;min-height:30px;transition:color .15s ease}
.seg button[aria-pressed=true]{color:var(--tx);font-weight:600}
.thumb{
  position:absolute;top:3px;left:0;height:calc(100% - 6px);border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.4);
  transition:transform .3s var(--move),width .3s var(--move);will-change:transform;
}
.dates{display:none;align-items:center;gap:6px;color:var(--tx3);position:relative;z-index:1}
@media (min-width:1100px){.dates{display:flex}}
input[type=date],input[type=number],input[type=password],input[type=text]{
  background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:11px;padding:6px 9px;color:var(--tx);min-height:32px;
  color-scheme:dark;transition:border-color .15s ease,background-color .15s ease;
}
input:focus{outline:none;border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.45)}
.spacer{flex:1}
.leds{display:flex;gap:5px;position:relative;z-index:1}
.led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(62,207,142,.7)}
.led.off{background:#555;box-shadow:none}
.ibtn{position:relative;z-index:1;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);background:rgba(255,255,255,.07);transition:transform .16s var(--out),background-color .15s ease,color .15s ease}
.ibtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:rgba(255,255,255,.14);color:var(--tx)}}
.ibtn.spin svg{animation:spin .7s var(--move)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- the Larp mode switch ---------- */
.sw{position:relative;z-index:1;display:flex;align-items:center;gap:9px;padding:3px 4px 3px 11px;border-radius:99px;color:var(--tx2);font-weight:600;font-size:12.5px;background:rgba(255,255,255,.06)}
.sw[aria-checked=true]{color:var(--tx)}
.track{position:relative;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 3px rgba(0,0,0,.55);transition:background-color .25s var(--out)}
.knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:99px;background:linear-gradient(180deg,#fff,#d6d8de);box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .3s var(--out),width .2s var(--out)}
.sw[aria-checked=true] .track{background:var(--green)}
.sw[aria-checked=true] .knob{transform:translateX(18px)}
.sw:active .knob{width:30px}
.sw[aria-checked=true]:active .knob{transform:translateX(12px)}

/* ---------- page ---------- */
.main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 2px 16px}
.phead h1{font-size:24px;font-weight:650;letter-spacing:-.022em}
.meta{color:var(--tx3);font-size:12.5px}
.phead .btn{margin-left:auto}

.card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;margin-bottom:14px;min-width:0;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  transition:border-color .2s ease;
}
@media (hover:hover) and (pointer:fine){.card:hover{border-color:var(--line2)}}
.card.flush{padding:0;overflow:hidden}
.card>h3,.ch{font-size:13.5px;font-weight:650;letter-spacing:-.005em;display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.card.flush>h3{padding:15px 18px 0}
.ch .r,.card>h3 .r{margin-left:auto;font-weight:400;color:var(--tx3);font-size:12.5px}
.ttl{font-size:13.5px;font-weight:600;color:var(--tx);border-bottom:1.5px dotted var(--tx3);padding-bottom:1px;cursor:default}
.big{display:flex;align-items:center;gap:10px;margin:8px 0 6px;flex-wrap:wrap}
.big>span:first-child{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.larp .big>span:first-child{font-size:40px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;color:var(--green);padding:2px 7px 2px 5px;border-radius:99px;background:rgba(62,207,142,.12)}
.chip.dn{color:var(--red);background:rgba(255,107,91,.12)}
.chip.nu{color:var(--tx2);background:rgba(255,255,255,.08)}
.chip svg{width:11px;height:11px}
.chip.dn svg{transform:rotate(90deg)}

.grid3{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid3{grid-template-columns:repeat(3,1fr)}}
.grid3 .card{margin:0}
.duo{display:grid;gap:14px}
@media (min-width:1100px){.duo{grid-template-columns:1fr 1fr;align-items:start}}
.duo .card{margin:0}
.stack{display:grid;gap:14px;margin-top:14px}

/* ---------- charts ---------- */
.cw{position:relative;margin:4px -4px 0}
.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.gl{stroke:rgba(255,255,255,.11);stroke-width:1}
.yl,.xl{fill:#aeb0b9;font-size:11px;font-weight:500}
.ln-main{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--out) .12s forwards}
.ln-prev{fill:none;stroke:var(--c);stroke-opacity:.4;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:.1 6;opacity:0;animation:fade .6s ease .5s forwards}
.area{opacity:0;animation:fade .8s ease .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.xh{stroke:rgba(255,255,255,.28);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s ease}
.dot{fill:var(--c);stroke:#fff;stroke-width:2;opacity:0;transition:opacity .15s ease}
.cw.on .xh,.cw.on .dot{opacity:1}
.tip{
  position:absolute;top:2px;left:0;z-index:5;pointer-events:none;opacity:0;white-space:nowrap;
  padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.35;
  background:rgba(30,32,38,.72);-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 22px rgba(0,0,0,.45);
  transition:opacity .12s ease;
}
.cw.on .tip{opacity:1}
.tip b{display:block;font-size:13px}.tip em{font-style:normal;color:var(--tx3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend svg{width:22px;height:6px;overflow:visible}

/* ---------- KPI strip ---------- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.kpi .k{font-size:12px;color:var(--tx2);font-weight:500}
.kpi .v{font-size:23px;font-weight:680;letter-spacing:-.025em;margin-top:3px;line-height:1.15}
.kpi .n{font-size:11.5px;color:var(--tx3);margin-top:2px}
.ok{color:var(--green)}.bad{color:var(--red)}.dim{color:var(--tx3)}

/* ---------- tables ---------- */
.scroll{overflow:auto;max-height:430px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th{position:sticky;top:0;z-index:1;font-size:11px;font-weight:600;color:var(--tx2);text-align:right;padding:9px 12px;background:#171718;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
tbody tr:last-child td{border-bottom:0}
@media (hover:hover) and (pointer:fine){tbody tr:hover td{background:rgba(255,255,255,.03)}}
tfoot td{font-weight:650;background:#171718;border-top:1px solid var(--line);border-bottom:0}
td.nm{white-space:normal;min-width:170px;font-weight:500}
td .s{color:var(--tx3);font-size:11.5px;font-weight:400}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--tx2)}
.badge.ok{background:rgba(62,207,142,.14);color:var(--green)}
.badge.bad{background:rgba(255,107,91,.14);color:var(--red)}
.badge.warn{background:rgba(245,197,99,.14);color:var(--amber)}

/* ---------- funnel / notes / minis ---------- */
.fr{display:grid;grid-template-columns:92px 1fr 110px;align-items:center;gap:12px;margin:6px 0}
.fr .l{font-size:12px;color:var(--tx2)}
.fb{height:24px;border-radius:8px;background:var(--blue);transform-origin:left;animation:grow .8s var(--out) both;animation-delay:calc(var(--i,0)*70ms + 150ms)}
.fb.f2{background:rgba(255,255,255,.55)}.fb.f3{background:rgba(255,255,255,.32)}.fb.f4{background:var(--green)}
@keyframes grow{from{transform:scaleX(0)}}
.fr .c{font-size:12px;color:var(--tx2);text-align:right}.fr .c b{color:var(--tx)}
.fbw{display:flex;align-items:center;gap:9px}.fbw span{font-weight:650;font-size:12.5px;min-width:30px}
.fbw .bar{flex:1}
.fgap{margin:0 0 0 104px;font-size:11.5px;color:var(--tx3);padding:1px 0 1px 10px;border-left:2px solid var(--line)}
@media (max-width:640px){.fr{grid-template-columns:78px 1fr}.fr .c{grid-column:2;text-align:left}.fgap{margin-left:90px}}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:13px;font-size:12.5px;line-height:1.5;margin-top:12px}
.note b{display:block}
.note.ok{background:rgba(62,207,142,.1);color:#8ee8be}
.note.bad{background:rgba(255,107,91,.1);color:#ff9d90}
.note.warn{background:rgba(245,197,99,.1);color:#f5d286}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.mi{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px}
.mi .k{font-size:11.5px;color:var(--tx2)}.mi .v{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:2px}.mi .n{font-size:11.5px;color:var(--tx3);margin-top:1px}
.empty{padding:26px 16px;text-align:center;color:var(--tx3)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}

/* ---------- allocations ---------- */
.pay{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pay.next{border-color:rgba(255,255,255,.28)}
.payhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.payhead .d{font-size:17px;font-weight:650;letter-spacing:-.015em}
.payhead .f{color:var(--tx2);font-size:12.5px}
.payhead .amt{margin-left:auto;font-size:18px;font-weight:680}
@media (max-width:640px){.payhead .amt{margin-left:0;width:100%}}
.ln{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.ln:last-child{border-bottom:0}
.lt{color:var(--tx2)}.lt b{display:block;color:var(--tx);font-weight:600}.lt em{font-style:normal;font-size:11.5px;color:var(--tx3)}
.lv{font-weight:620;font-size:15px;white-space:nowrap}
.ln.out .lv{color:#ff9d90}
.ln.net{background:rgba(255,255,255,.04)}.ln.net .lv{font-size:20px;font-weight:720}
.ln.move{padding-left:30px}.ln.car{background:rgba(62,207,142,.08)}.ln.car .lv{color:var(--green);font-size:18px}
.ln input{width:112px;text-align:right}
.tick{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:rgba(62,207,142,.14);color:var(--green);margin-left:6px}

/* ---------- buttons / forms ---------- */
.btn{padding:8px 15px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600;font-size:12.5px;transition:transform .16s var(--out),background-color .15s ease}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:rgba(255,255,255,.14)}}
.btn.p{background:linear-gradient(180deg,#f4f5f8,#c9ccd5);color:#0a0b0d;border-color:transparent}
@media (hover:hover) and (pointer:fine){.btn.p:hover{filter:brightness(1.06);background:linear-gradient(180deg,#f4f5f8,#c9ccd5)}}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--tx2)}
.field label{width:190px;max-width:100%}
.foot{color:var(--tx3);font-size:12px;line-height:1.6;margin-top:8px}
.rowlist{display:grid;gap:6px}
.rl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04)}
.rl .t{font-weight:600}.rl .t em{font-style:normal;color:var(--tx3);font-weight:400;margin-left:6px}
.rl .a{font-size:18px;font-weight:680;letter-spacing:-.02em}
.rl.key{background:rgba(255,255,255,.05)}.rl.key .a{color:var(--green)}
.meter{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:10px 0 7px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2aa876,var(--green));transform-origin:left;animation:grow 1s var(--out) both}
.mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3)}
.lab{font-size:11px;font-weight:650;color:var(--tx2);letter-spacing:.03em}
.two{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

/* ---------- floating dock ---------- */
.dock{
  position:fixed;z-index:60;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;gap:2px;padding:5px;border-radius:30px;max-width:calc(100% - 20px);
}
.dock button{
  position:relative;z-index:1;width:66px;height:54px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--tx2);font-size:10.5px;font-weight:600;transition:color .2s ease,transform .16s var(--out);
}
.dock button svg{width:20px;height:20px}
.dock button[aria-current=page]{color:#fff}
.dock button:active{transform:scale(.94)}
.lens{
  position:absolute;top:5px;left:0;height:54px;border-radius:25px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.35);
  transition:transform .32s var(--move),width .32s var(--move);will-change:transform;
}
@media (max-width:420px){.dock button{width:56px}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade-in .2s ease-out}
.modal.out{animation:fade-out .15s ease-in forwards}
.box{width:100%;max-width:440px;max-height:92dvh;overflow:auto;border-radius:26px;animation:pop .26s var(--out)}
.box h3{font-size:16px;font-weight:650;padding:18px 20px 12px;position:relative;z-index:1}
.mbody{padding:2px 20px 4px;position:relative;z-index:1}
.mfoot{display:flex;gap:10px;padding:14px 20px 18px;position:relative;z-index:1}
.amsec{background:rgba(0,0,0,.26);border-radius:14px;padding:11px 13px 13px;margin-bottom:11px}
.amsec .lab{display:block;margin-bottom:8px}
.amrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--tx2)}
.amrow label{display:flex;align-items:center;gap:6px}.amrow input{width:68px;text-align:right}
#am-date{width:165px;text-align:left}
.amop{font-weight:650;color:var(--tx)}.amop.bad{color:var(--red)}
.ammsg{min-height:18px;color:var(--red);font-size:12.5px}
@keyframes fade-in{from{opacity:0}}@keyframes fade-out{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}}

/* ---------- sign in ---------- */
#gate{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gatebox{width:100%;max-width:330px;padding:26px 24px 22px;border-radius:30px;animation:pop .5s var(--out)}
.gatebox>*{position:relative;z-index:1}
.gatebox .logo{width:38px;height:38px;border-radius:12px;margin-bottom:16px}
.gatebox h1{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-bottom:3px}
.gatebox p{color:var(--tx2);margin-bottom:16px}
.gatebox input{width:100%;margin-bottom:10px;padding:10px 12px}
.gatebox .btn{width:100%;padding:11px}

/* ---------- motion ---------- */
.rise{animation:rise .5s var(--out) both;animation-delay:calc(var(--i,0)*45ms)}
.still .rise,.still .fb,.still .meter i,.still .ln-main,.still .ln-prev,.still .area{animation:none!important}
.still .ln-main{stroke-dashoffset:0}.still .ln-prev,.still .area{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
body.larp [data-nl]{display:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ln-main{stroke-dashoffset:0}.ln-prev,.area{opacity:1}
}
@media (prefers-reduced-transparency:reduce){
  .glass,.tip,.modal{-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass{background:#24262c}.tip{background:#24262c}
}
@media (max-width:700px){
  .top{position:relative;top:auto;margin-top:max(8px,env(safe-area-inset-top));width:calc(100% - 20px);border-radius:24px;padding:7px 8px;gap:8px}
  .brand{order:1;padding:0 2px}.tag{display:none}
  .spacer{display:block;order:2;flex:1}
  .leds{display:none}
  .sw{order:3;padding:3px 4px 3px 11px}
  .ibtn{order:4}
  .seg{order:5;width:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 24px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 24px),transparent 100%)}
  .main{padding:calc(12px + env(safe-area-inset-top)) 10px calc(112px + env(safe-area-inset-bottom))}
  .phead{margin:4px 4px 12px;gap:0 10px}.phead h1{font-size:24px}.meta{font-size:12px;width:100%}
  .card{padding:14px 14px 12px;border-radius:18px;margin-bottom:12px}
  .grid3,.duo,.stack{gap:12px}
  .big>span:first-child{font-size:31px}.larp .big>span:first-child{font-size:38px}
  .cw{margin:2px -6px 0}
  .yl,.xl{font-size:11.5px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .kpi{padding:12px 13px}.kpi .v{font-size:22px}
  table{min-width:0!important}.hm{display:none}
  th,td{padding:10px 8px}th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:14px}
  .scroll{max-height:380px}
  .dock{bottom:max(10px,env(safe-area-inset-bottom))}
  .payhead,.ln{padding-left:14px;padding-right:14px}.ln.move{padding-left:24px}
  .ln input{width:96px}
  .field label{width:100%}
  .two{gap:16px}
  .fr{margin:8px 0}.fr .c:empty{display:none}
  td.nm{min-width:0;white-space:normal}
  .card>h3{flex-wrap:wrap;row-gap:2px}.card>h3 .r,.ch .r{margin-left:0;width:100%}
  .phead h1{order:1}.phead .btn{order:2}.phead .meta{order:3}
}

/* ---------- overview: metric tabs, one big graph, activity sheet ---------- */
.hero{max-width:1040px;margin:0 auto}
.mtabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 2px 4px}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{position:relative;z-index:1;flex:none;min-width:120px;text-align:left;padding:9px 14px 10px;border-radius:16px;color:var(--tx2);transition:color .2s ease}
.mtabs button small{display:block;font-size:12.5px;font-weight:500}
.mtabs .tv{display:flex;align-items:center;gap:8px;margin-top:1px}
.mtabs b{font-size:19px;font-weight:680;letter-spacing:-.02em;color:var(--tx)}
.mtabs button[aria-pressed=true] small{color:var(--tx)}
.mtabs .spk{width:28px;height:14px;color:var(--c);flex:none}
.mtabs .thumb{top:2px;height:calc(100% - 6px);border-radius:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(255,255,255,.06)}
.herochart{position:relative;margin-top:12px}
.hl{display:flex;align-items:center;gap:9px;margin:0 2px 4px;flex-wrap:wrap}
.hlv{font-size:12px}
.hero .cw{margin:0}
.pills{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.pillbtn{display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600;font-size:14px;transition:transform .16s var(--out),background-color .15s ease}
.pillbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.pillbtn:hover{background:rgba(255,255,255,.12)}}
.pillbtn svg{width:18px;height:18px;flex:none}
.phead .pillbtn{margin-left:auto;padding:7px 13px;font-size:13px;border-radius:13px}
.phead .pillbtn+.btn{margin-left:0}
.sheet{margin:30px 0 0;padding:24px 18px 22px;border-radius:32px;background:#141415;border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 24px 60px rgba(0,0,0,.4)}
.sheet h2{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0 2px 16px}
.alist{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:900px){.alist{grid-template-columns:repeat(2,1fr)}}
.arow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);transition:transform .16s var(--out),border-color .15s ease}
.arow:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.arow:hover{border-color:var(--line2)}}
.ai{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:var(--tx2);flex:none}
.ai svg{width:18px;height:18px}
.at{flex:1;min-width:0}.at b{display:block;font-weight:600}.at em{display:block;font-style:normal;color:var(--tx3);font-size:12px}
.av{font-weight:680;font-size:16px}
.chev{width:16px;height:16px;color:var(--tx3);flex:none}
.sheet .card{background:var(--card)}
.plist{display:grid;gap:2px;margin-bottom:12px}
.plist button{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;font-weight:500;text-align:left;transition:background-color .15s ease}
.plist button[aria-pressed=true]{background:rgba(255,255,255,.11);font-weight:650}
.plist button[aria-pressed=true]::after{content:"✓";color:var(--blue)}
@media (hover:hover) and (pointer:fine){.plist button:hover{background:rgba(255,255,255,.07)}}
/* re-draw the graph even when the rest of the page is held still */
.still .herochart.redraw .ln-main{animation:draw 1.1s var(--out) forwards!important;stroke-dashoffset:1}
.still .herochart.redraw .ln-prev{opacity:0;animation:fade .6s ease .4s forwards!important}
.still .herochart.redraw .area{opacity:0;animation:fade .8s ease .3s forwards!important}
@media (prefers-reduced-motion:reduce){
  .still .herochart.redraw .ln-main{animation:none!important;stroke-dashoffset:0}
  .still .herochart.redraw .ln-prev,.still .herochart.redraw .area{animation:none!important;opacity:1}
}
@media (max-width:700px){
  .mtabs button{min-width:114px}
  .sheet{margin:26px -10px 0;border-radius:30px 30px 0 0;padding:22px 12px 20px;border-left:0;border-right:0}
  .sheet h2{font-size:21px}
  .pills .pillbtn{flex:1;justify-content:center;max-width:210px;padding:12px 10px}
  .phead .pillbtn{order:2}
}
#rangemodal .amrow{flex-wrap:nowrap;gap:8px}#from,#to{width:100%;min-width:0;flex:1;font-size:14px;padding:9px 8px;text-align:left}
.arow.static{cursor:default}.arow.static:active{transform:none}
.plist2{margin-top:6px}.prow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.pd{flex:1;min-width:0}.pd b{display:block;font-weight:600}.pd em{font-style:normal;color:var(--tx3);font-size:12px}
.pst{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(245,197,99,.14);color:var(--amber)}.pst.ok{background:rgba(62,207,142,.14);color:var(--green)}
.gerr{color:var(--red);min-height:18px;margin:-2px 0 8px;font-size:13px}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:skl 1.2s linear infinite}
@keyframes skl{to{background-position:-200% 0}}
body.larp #larpsw .swl{display:none}
@keyframes flash{0%{box-shadow:0 0 0 2px rgba(255,255,255,.5)}100%{box-shadow:0 0 0 2px rgba(255,255,255,0)}}
.pay.flash{animation:flash .9s var(--out)}
.ampreview{margin:2px 2px 12px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx2);font-size:13px;line-height:1.5}
.ampreview b{color:var(--tx)}
html,body{overscroll-behavior-y:contain}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:80;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);background:#1d1f25;border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,-46px);pointer-events:none}
#ptr.settle{transition:transform .28s var(--out),opacity .2s ease}
#ptr.ready{color:var(--blue)}
#ptr.busy svg{animation:spin .8s linear infinite}
.gran{display:flex;gap:4px;margin:14px auto 0;padding:3px;border-radius:14px;background:rgba(255,255,255,.06);width:max-content}
.gran button{padding:6px 15px;border-radius:11px;font-size:13px;font-weight:600;color:var(--tx2);transition:background-color .18s ease,color .18s ease,transform .16s var(--out)}
.gran button:active{transform:scale(.96)}
.gran button[aria-pressed=true]{background:rgba(255,255,255,.14);color:var(--tx)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div id="gate">
  <form class="gatebox glass" id="gateform">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M2 11.5 5.5 7l3 3L14 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Sign in</h1>
    <p>This dashboard is private.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password">
    <div class="gerr" id="gateerr" role="alert"></div>
    <button type="button" id="enter" class="btn p">Continue</button>
  </form>
</div>

<div id="app" hidden>
  <div id="ptr" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.07M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <main class="main"><div id="view"></div></main>

  <nav class="dock glass" id="dock" aria-label="Pages">
    <span class="lens"></span>
    <button data-v="overview" aria-current="page"><svg viewBox="0 0 20 20" fill="none"><path d="M3 16V9m5 7V4m5 12v-5m4 5V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Overview</button>
    <button data-v="alloc" data-nl><svg viewBox="0 0 20 20" fill="none"><path d="M10 3v13M10 3 5.5 7.5M10 3l4.5 4.5M3.5 17h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Allocate</button>
    <button data-v="ads" data-nl><svg viewBox="0 0 20 20" fill="none"><path d="M3 8h3.5L13 4v12l-6.5-4H3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Ads</button>
    <button data-v="money" data-nl><svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="2.6" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="10.25" r="2.2" stroke="currentColor" stroke-width="1.7"/></svg>Money</button>
    <button data-v="stock" data-nl><svg viewBox="0 0 20 20" fill="none"><path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m3 6.5 7 3.5m0 0 7-3.5M10 10v7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Stock</button>
    <button data-v="settings"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2m12.8-5.3-1.4 1.4M6.1 13.9l-1.4 1.4m10.6 0-1.4-1.4M6.1 6.1 4.7 4.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Settings</button>
  </nav>
</div>

<div class="modal" id="rangemodal" hidden>
  <div class="box glass" role="dialog" aria-modal="true" aria-label="Date range">
    <h3>Date range</h3>
    <div class="mbody">
      <div class="plist" id="presets">
        <button data-p="today">Today</button><button data-p="yday">Yesterday</button><button data-p="7">Last 7 days</button><button data-p="14">Last 14 days</button>
        <button data-p="30">Last 30 days</button><button data-p="mtd">This month</button><button data-p="lastmo">Last month</button>
      </div>
      <div class="amsec"><span class="lab">CUSTOM</span><div class="amrow"><input type="date" id="from" aria-label="From"><span>–</span><input type="date" id="to" aria-label="To"></div></div>
    </div>
    <div class="mfoot"><button type="button" class="btn p" id="rangedone">Done</button></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box glass" role="dialog" aria-modal="true" aria-label="Edit allocation splits">
    <h3>Edit allocation splits</h3>
    <div class="mbody">
      <div class="amsec"><span class="lab">NEW SPLIT — what moves from the switch date on</span>
        <div class="amrow"><label>Personal <input type="number" id="am-acar" min="0" max="100" step="1">%</label>
        <label>Stock <input type="number" id="am-ast" min="0" max="100" step="1">%</label>
        <span>Operating <span class="amop" id="am-aop">35%</span></span></div></div>
      <div class="amsec"><span class="lab">SWITCH DATE — the new split starts on</span>
        <div class="amrow"><input type="date" id="am-date" aria-label="Switch date"></div></div>
      <div class="amsec"><span class="lab">EARLIER SPLIT — for days before that</span>
        <div class="amrow"><label>Personal <input type="number" id="am-bcar" min="0" max="100" step="1">%</label>
        <label>Stock <input type="number" id="am-bst" min="0" max="100" step="1">%</label>
        <span>Operating <span class="amop" id="am-bop">35%</span></span></div></div>
      <div class="ampreview" id="am-prev"></div>
      <div class="ammsg" id="am-msg"></div>
    </div>
    <div class="mfoot"><button type="button" class="btn p" id="am-save">Save</button><button type="button" class="btn" id="am-cancel">Cancel</button></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>

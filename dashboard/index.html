<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<style>
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --sub:#FAFAFA; --sunken:#F3F3F3;
  --border:#E3E3E3; --border-2:#CDCDCD;
  --text:#303030; --text-2:#616161; --text-3:#8A8A8A;
  --brand:#005BD3; --brand-bg:#EAF2FE;
  --nav:#1A1A1A; --nav-2:#303030; --nav-text:#E3E3E3; --nav-dim:#9A9A9A;
  --ok-t:#0C5132; --ok-b:#CDFEE1;
  --bad-t:#8E1F0B; --bad-b:#FFD6D6;
  --warn-t:#5E4200; --warn-b:#FFE7B8;
  --grid:#E3E3E3;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0E; --surface:#1A1A1A; --sub:#212121; --sunken:#141414;
    --border:#303030; --border-2:#404040;
    --text:#E3E3E3; --text-2:#A0A0A0; --text-3:#7A7A7A;
    --brand:#5AA3FF; --brand-bg:#11243C;
    --nav:#000000; --nav-2:#1A1A1A; --nav-text:#E3E3E3; --nav-dim:#8A8A8A;
    --ok-t:#7CE0AC; --ok-b:#0C2A1C;
    --bad-t:#FF9A87; --bad-b:#331512;
    --warn-t:#F5C563; --warn-b:#2E2410;
    --grid:#303030;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1A1A1A; --sub:#212121; --sunken:#141414;
  --border:#303030; --border-2:#404040;
  --text:#E3E3E3; --text-2:#A0A0A0; --text-3:#7A7A7A;
  --brand:#5AA3FF; --brand-bg:#11243C;
  --nav:#000000; --nav-2:#1A1A1A; --nav-text:#E3E3E3; --nav-dim:#8A8A8A;
  --ok-t:#7CE0AC; --ok-b:#0C2A1C;
  --bad-t:#FF9A87; --bad-b:#331512;
  --warn-t:#F5C563; --warn-b:#2E2410;
  --grid:#303030;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
[hidden]{display:none!important}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:1px;}

/* ---------------- gate ---------------- */
#gate{min-height:100dvh; display:grid; place-items:center; padding:24px;}
.gatebox{width:100%; max-width:312px;}
.gatebox .mark{width:34px;height:34px;border-radius:9px;background:var(--nav);display:grid;place-items:center;margin-bottom:18px}
.gatebox h1{font-size:16px; font-weight:650; margin:0 0 3px; letter-spacing:-.01em;}
.gatebox p{margin:0 0 18px; color:var(--text-3); font-size:13px;}
.gatebox input{width:100%; padding:9px 11px; border:1px solid var(--border-2); border-radius:var(--r); background:var(--surface); color:var(--text); margin-bottom:9px;}
.gatebox button{width:100%; padding:10px; border:0; border-radius:var(--r); background:var(--nav); color:#fff; font-weight:600; cursor:pointer;}
.gatebox .err{color:var(--bad-t); font-size:12.5px; min-height:18px; margin-top:8px;}

/* ---------------- chrome ---------------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--nav); color:var(--nav-text);
  display:flex; align-items:center; gap:12px; padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top));
  min-height:52px;
}
.tbrow{display:flex; align-items:center; gap:10px; min-width:0;}
.tbtop{flex:1; min-width:0;}
.tbbot{flex:none; margin-left:auto;}
.mark{width:26px;height:26px;border-radius:7px;background:var(--nav-2);display:grid;place-items:center;flex:none}
.seg{display:flex; gap:1px; background:var(--nav-2); border-radius:8px; padding:2px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0; background:transparent; color:var(--nav-dim); padding:5px 10px; border-radius:6px; font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; min-height:28px;}
.seg button:hover{color:var(--nav-text)}
.seg button[aria-pressed="true"]{background:var(--nav-text); color:var(--nav); font-weight:600;}
.dates{display:flex; align-items:center; gap:5px; color:var(--nav-dim); font-size:12.5px;}
.topbar input[type=date]{
  background:var(--nav-2); border:1px solid transparent; color:var(--nav-text);
  border-radius:7px; padding:5px 8px; font-size:12.5px; color-scheme:dark; min-height:28px;
}
.tbtn{background:var(--nav-2); border:0; color:var(--nav-text); padding:6px 12px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; min-height:30px;}
.tbtn:hover{background:#3d3d3d}
.tbtn.ghost{background:transparent; color:var(--nav-dim); font-weight:500;}
.tbtn.ghost:hover{color:var(--nav-text)}
.health{display:flex; gap:5px; align-items:center;}
.led{width:7px;height:7px;border-radius:50%;background:#5c5c5c}
.led.ok{background:#22C55E} .led.bad{background:#EF4444}

.shell{display:grid; grid-template-columns:206px 1fr; min-height:calc(100dvh - 52px);}
.side{border-right:1px solid var(--border); background:var(--surface); padding:10px 8px; align-self:start; position:sticky; top:52px; max-height:calc(100dvh - 52px); overflow-y:auto;}
.side a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:var(--r);
  color:var(--text-2); text-decoration:none; font-weight:500; font-size:13px; margin-bottom:1px; cursor:pointer;
}
.side a:hover{background:var(--sunken); color:var(--text);}
.side a[aria-current="page"]{background:var(--sunken); color:var(--text); font-weight:600;}
.side a svg{flex:none; opacity:.75}
.side .grp{font-size:11px; font-weight:600; color:var(--text-3); padding:12px 9px 5px; letter-spacing:.02em;}
.main{padding:18px 20px 56px; min-width:0;}
.inner{max-width:1380px}
/* Desktop only: sit the two narrow cards side by side instead of stacking. */
.duo{display:grid; gap:14px}
@media (min-width:1200px){
  .duo{grid-template-columns:1fr 1fr; align-items:start}
  .main{padding:22px 26px 64px}
  .kpis{gap:12px}
  .kpi{padding:14px 16px} .kpi .v{font-size:26px}
  .card > h3{padding:15px 18px 12px; font-size:14px}
  .pad{padding:0 18px 18px}
  th:first-child,td:first-child{padding-left:18px} th:last-child,td:last-child{padding-right:18px}
}
@media (min-width:1560px){ .kpis{grid-template-columns:repeat(8,1fr)} }
@media (max-width:840px){
  .topbar{position:static; flex-wrap:wrap; gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));}
  .tbrow{width:100%}
  .tbtop{gap:8px}
  .tbbot{margin-left:0; gap:8px}
  .dates{flex:1; min-width:0; gap:4px}
  .topbar input[type=date]{flex:1; min-width:0; min-height:38px; text-align:center}
  .tbtn{min-height:38px; padding:8px 16px}
  .hide-sm{display:none}
  .seg button{min-height:36px; padding:7px 13px; font-size:13.5px}

  .shell{grid-template-columns:1fr; grid-template-rows:auto 1fr; min-height:0}
  .side{
    display:flex; align-items:center; gap:3px; overflow-x:auto; scrollbar-width:none;
    border-right:0; border-bottom:1px solid var(--border); padding:6px 10px;
    position:sticky; top:0; z-index:30; -webkit-overflow-scrolling:touch;
  }
  .side::-webkit-scrollbar{display:none}
  .side a{white-space:nowrap; margin:0; flex:none; min-height:38px; padding:8px 12px; font-size:13.5px}
  .side .grp{display:none}
  .main{padding:14px 12px calc(48px + env(safe-area-inset-bottom))}

  .phead h2{font-size:22px}
  .kpi{padding:13px 14px} .kpi .v{font-size:26px}
  th{padding:9px 10px; font-size:11.5px} td{padding:11px 10px; font-size:13px}
  th:first-child,td:first-child{padding-left:14px} th:last-child,td:last-child{padding-right:14px}
  .card > h3{font-size:15px; padding:14px 14px 11px}
  .card > h3 .r{float:none; display:block; margin-top:3px; font-size:12.5px}
  .pad{padding:0 14px 16px}
  .mi .v{font-size:21px}
  .rl{padding:12px 13px} .rl .a{font-size:19px}
  .rl .t em{display:block; margin:2px 0 0}
  .note{font-size:13px}
}

/* ---------------- page ---------------- */
.phead{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.phead h2{font-size:19px; font-weight:650; margin:0; letter-spacing:-.015em;}
.phead .meta{color:var(--text-3); font-size:12.5px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; overflow:hidden;}
.card > h3{font-size:13.5px; font-weight:650; margin:0; padding:13px 16px 11px; letter-spacing:-.005em;}
.card > h3 .r{float:right; font-weight:400; color:var(--text-3); font-size:12.5px;}
.pad{padding:0 16px 16px}
.hr{height:1px; background:var(--border)}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
.kpi .k{font-size:11.5px; color:var(--text-2); font-weight:500;}
.kpi .v{font-size:24px; font-weight:650; letter-spacing:-.022em; margin-top:3px; line-height:1.15;}
.kpi .n{font-size:11.5px; color:var(--text-3); margin-top:2px;}
.kpi.key{border-color:var(--border-2); background:var(--sub);}
.v.ok{color:var(--ok-t)} .v.bad{color:var(--bad-t)}

table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px;}
.scroll{overflow-x:auto}
th{font-size:11px; font-weight:600; color:var(--text-2); text-align:right; padding:8px 12px; background:var(--sunken); border-top:1px solid var(--border); border-bottom:1px solid var(--border); white-space:nowrap;}
th:first-child,td:first-child{text-align:left; padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sub)}
tfoot td{font-weight:650; background:var(--sunken); border-top:1px solid var(--border); border-bottom:0;}
td.n{white-space:normal; min-width:180px; font-weight:500}
td .s{color:var(--text-3); font-size:11.5px; font-weight:400}
.dim{color:var(--text-3)}
.badge{display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:7px; background:var(--sunken); color:var(--text-2);}
.badge.ok{background:var(--ok-b); color:var(--ok-t)}
.badge.bad{background:var(--bad-b); color:var(--bad-t)}
.badge.warn{background:var(--warn-b); color:var(--warn-t)}

.note{display:flex; gap:10px; padding:11px 13px; border-radius:var(--r); font-size:12.5px; line-height:1.5; align-items:flex-start; border:1px solid transparent;}
.note b{display:block}
.note.ok{background:var(--ok-b); color:var(--ok-t)}
.note.bad{background:var(--bad-b); color:var(--bad-t)}
.note.warn{background:var(--warn-b); color:var(--warn-t)}

.funnel{display:grid; gap:2px}
.fr{display:grid; grid-template-columns:96px 1fr 118px; align-items:center; gap:12px}
@media (max-width:640px){.fr{grid-template-columns:80px 1fr}.fr .c{grid-column:2;text-align:left}}
.fr .l{font-size:12px; color:var(--text-2)}
.fbar{height:26px; border-radius:6px; background:var(--brand); min-width:3px; display:flex; align-items:center; padding:0 9px; color:#fff; font-weight:600; font-size:12.5px}
.fbar.f2{background:color-mix(in srgb,var(--brand) 76%,var(--surface))}
.fbar.f3{background:color-mix(in srgb,var(--brand) 48%,var(--surface)); color:var(--text)}
.fbar.f4{background:#0C7C4A}
.fr .c{font-size:12px; color:var(--text-2); text-align:right}
.fr .c b{color:var(--text)}
.fgap{display:grid; grid-template-columns:96px 1fr; gap:12px}
@media (max-width:640px){.fgap{grid-template-columns:80px 1fr}}
.fgap div:last-child{font-size:11.5px; color:var(--text-3); padding:3px 0 3px 11px; border-left:2px solid var(--border)}

.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:16px}
.rowlist{display:grid; gap:5px}
.rl{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r); background:var(--sunken)}
.rl .t{font-size:12.5px; font-weight:600} .rl .t em{font-style:normal; color:var(--text-3); font-weight:400; margin-left:5px}
.rl .a{font-size:17px; font-weight:650; letter-spacing:-.018em}
.rl.key{background:var(--brand-bg)} .rl.key .a{color:var(--brand)}
.meter{height:8px; border-radius:99px; background:var(--sunken); overflow:hidden; margin:9px 0 6px}
.meter i{display:block; height:100%; background:var(--brand)}
.mrow{display:flex; justify-content:space-between; font-size:12px; color:var(--text-3)}
.lab{font-size:11px; font-weight:600; color:var(--text-2)}
.mini{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.mi{background:var(--sunken); border-radius:var(--r); padding:10px 12px}
.mi .k{font-size:11px; color:var(--text-2); font-weight:500}
.mi .v{font-size:19px; font-weight:650; letter-spacing:-.018em; margin-top:2px}
.mi .n{font-size:11.5px; color:var(--text-3); margin-top:1px}

.field{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--text-2)}
.field input{padding:7px 10px; border:1px solid var(--border-2); border-radius:var(--r); background:var(--surface); color:var(--text); width:130px; color-scheme:light dark;}

/* ---------------- allocations ---------------- */
.pay{background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; overflow:hidden}
.pay.next{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand)}
.payhead{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.payhead .d{font-size:16px; font-weight:650; letter-spacing:-.012em}
.payhead .f{color:var(--text-2); font-size:12.5px}
.payhead .amt{margin-left:auto; font-size:18px; font-weight:650}
@media (max-width:640px){.payhead .amt{margin-left:0; width:100%}}
.ln{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); font-size:13.5px}
.ln .lt{color:var(--text-2)} .ln .lt b{color:var(--text); font-weight:600; display:block}
.ln .lt em{font-style:normal; font-size:11.5px; color:var(--text-3)}
.ln .lv{font-weight:600; font-size:15px; white-space:nowrap}
.ln.out .lv{color:var(--bad-t)}
.ln.net{background:var(--sunken)} .ln.net .lv{font-size:19px; font-weight:700}
.ln.move{padding-left:28px} .ln.move .lv{color:var(--text)}
.ln.move.car{background:var(--brand-bg)} .ln.move.car .lv{color:var(--brand); font-size:17px}
.ln:last-child{border-bottom:0}
.ln input{width:104px; padding:5px 8px; border:1px solid var(--border-2); border-radius:6px; background:var(--surface); color:var(--text); text-align:right; font-size:13px}
.tick{font-size:11px; font-weight:600; padding:1px 7px; border-radius:7px; background:var(--ok-b); color:var(--ok-t); margin-left:6px}
.btn{padding:7px 13px; border:1px solid var(--border-2); border-radius:var(--r); background:var(--surface); color:var(--text); font-weight:600; font-size:12.5px; cursor:pointer;}
.btn:hover{background:var(--sunken)}
.btn.p{background:var(--nav); border-color:var(--nav); color:#fff}
.btn.p:hover{filter:brightness(1.25)}
.empty{padding:26px 16px; text-align:center; color:var(--text-3); font-size:12.5px}
.empty b{display:block; color:var(--text); font-size:13px; margin-bottom:4px}
.skel{height:11px; border-radius:99px; background:linear-gradient(90deg,var(--sunken),var(--border),var(--sunken)); background-size:200% 100%; animation:sk 1.4s linear infinite; margin:16px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
svg.chart{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-3);padding:8px 16px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.foot{color:var(--text-3); font-size:11.5px; line-height:1.6; margin-top:6px}
</style>
</head>
<body>

<div id="gate">
  <form class="gatebox" id="gateform">
    <div class="mark"><svg width="17" height="17" viewBox="0 0 16 16" fill="none"><path d="M2 11.5 5.5 7l3 3L14 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Sign in</h1>
    <p>This dashboard is private.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <button type="submit">Continue</button>
    <div class="err" id="gateerr"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="tbrow tbtop">
      <div class="mark"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 11.5 5.5 7l3 3L14 4" stroke="#E3E3E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="seg" id="presets" role="group" aria-label="Date range">
        <button data-p="today">Today</button>
        <button data-p="yday">Yesterday</button>
        <button data-p="7">7d</button>
        <button data-p="14">14d</button>
        <button data-p="30">30d</button>
        <button data-p="mtd">Month</button>
        <button data-p="lastmo">Last month</button>
      </div>
    </div>
    <div class="tbrow tbbot">
      <div class="dates">
        <input type="date" id="from" aria-label="From"><span>–</span><input type="date" id="to" aria-label="To">
      </div>
      <div class="health" title="Data sources">
        <span class="led" id="led-db"></span><span class="led" id="led-meta"></span><span class="led" id="led-stripe"></span>
      </div>
      <button class="tbtn" id="refresh">Refresh</button>
      <button class="tbtn ghost hide-sm" id="signout">Sign out</button>
    </div>
  </header>

  <div class="shell">
    <nav class="side" id="nav">
      <div class="grp">Reports</div>
      <a data-v="overview" aria-current="page"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 13V7m4 6V3m4 10V8m4 5v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Overview</a>
      <a data-v="alloc"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M8 2 4.5 5.5M8 2l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Allocations</a>
      <a data-v="ads"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 6.5h3l5-3.5v10l-5-3.5h-3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M13 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Ads</a>
      <a data-v="money"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="8.5" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8.25" r="1.7" stroke="currentColor" stroke-width="1.4"/></svg>Money</a>
      <a data-v="stock"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 5.5 8 2.5l5.5 3v5L8 13.5l-5.5-3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M2.5 5.5 8 8.5m0 0 5.5-3M8 8.5v5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Stock</a>
      <div class="grp">Setup</div>
